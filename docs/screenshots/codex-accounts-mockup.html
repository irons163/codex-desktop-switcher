<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Codex Accounts Mockup</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 980px;
      height: 640px;
      background: #0d0d0d;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #ececec;
      padding: 24px;
    }
    .app {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: 220px 1fr;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 24px 60px rgba(0,0,0,.45);
    }
    .sidebar {
      background: #171717;
      border-right: 1px solid rgba(255,255,255,.06);
      padding: 18px 10px;
    }
    .sidebar h2 {
      font-size: 13px;
      color: #9b9b9b;
      padding: 0 10px 12px;
      font-weight: 600;
    }
    .nav-item {
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 14px;
      color: #c5c5c5;
      margin-bottom: 2px;
    }
    .nav-item.active {
      background: rgba(255,255,255,.08);
      color: #fff;
      font-weight: 600;
    }
    .group-label {
      margin-top: 16px;
      padding: 8px 10px 4px;
      font-size: 11px;
      color: #8a8a8a;
      text-transform: none;
    }
    .main {
      background: #212121;
      padding: 28px 34px;
    }
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .page-title { font-size: 18px; font-weight: 600; }
    .status { font-size: 12px; color: #9b9b9b; }
    .section { margin-bottom: 18px; }
    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: #9b9b9b;
      margin-bottom: 8px;
    }
    .panel {
      background: rgba(255,255,255,.04);
      border-radius: 8px;
      overflow: hidden;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px;
    }
    .row + .row { border-top: 1px solid rgba(255,255,255,.08); }
    .main-col { min-width: 0; flex: 1; }
    .primary { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .secondary { font-size: 12px; color: #9b9b9b; margin-top: 3px; }
    .actions { display: flex; gap: 8px; flex-shrink: 0; }
    .action {
      border: 0;
      border-radius: 7px;
      background: rgba(255,255,255,.09);
      color: #ececec;
      font: inherit;
      font-size: 13px;
      min-height: 30px;
      padding: 0 10px;
    }
    .action:disabled { opacity: .45; }
    .toolbar {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .toolbar .action.primary {
      background: rgba(255,255,255,.14);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h2>Settings</h2>
      <div class="nav-item">General</div>
      <div class="nav-item">Personalization</div>
      <div class="group-label">Account Switcher</div>
      <div class="nav-item active">Accounts</div>
    </aside>
    <main class="main">
      <div class="page-header">
        <div class="page-title">Accounts</div>
        <div class="status">Ready</div>
      </div>
      <section class="section">
        <div class="section-title">Current account</div>
        <div class="panel">
          <div class="row">
            <div class="main-col">
              <div class="primary">alex@example.com</div>
            </div>
          </div>
        </div>
      </section>
      <section class="section">
        <div class="section-title">Saved accounts</div>
        <div class="panel">
          <div class="row">
            <div class="main-col">
              <div class="primary">alex@example.com</div>
              <div class="secondary">work · Current</div>
            </div>
            <div class="actions">
              <button class="action" disabled>Switch</button>
              <button class="action">Delete</button>
            </div>
          </div>
          <div class="row">
            <div class="main-col">
              <div class="primary">dev@example.com</div>
              <div class="secondary">personal</div>
            </div>
            <div class="actions">
              <button class="action">Switch</button>
              <button class="action">Delete</button>
            </div>
          </div>
        </div>
        <div class="toolbar">
          <button class="action primary">Save current account</button>
          <button class="action">New sign-in</button>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
