name: Release

"on":
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to build and update
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: codex-account-switcher-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # GitHub requires repository write access to read unpublished releases.
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_version: ${{ steps.release.outputs.release_version }}
      release_id: ${{ steps.release.outputs.release_id }}
      source_sha: ${{ steps.release.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve and validate release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Expected a version tag such as v0.1.0 or v0.2.0-beta.1." >&2
            exit 1
          fi
          SOURCE_SHA="$(git rev-parse HEAD)"
          test "$SOURCE_SHA" = "$(git rev-list -n 1 "$RELEASE_TAG")"
          git merge-base --is-ancestor "$SOURCE_SHA" "origin/$DEFAULT_BRANCH"
          # The tag endpoint only returns published releases. List releases so
          # workflow_dispatch can build a draft before publishing its assets.
          RELEASE_JSON="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\")")"
          RELEASE_ID="$(jq -er '.id' <<< "$RELEASE_JSON")"
          IS_PRERELEASE="$(jq -r '.prerelease' <<< "$RELEASE_JSON")"
          if [[ "$RELEASE_TAG" == *-* && "$IS_PRERELEASE" != true ]] || \
             [[ "$RELEASE_TAG" != *-* && "$IS_PRERELEASE" == true ]]; then
            echo "The version suffix and GitHub prerelease flag must agree." >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          import plistlib
          import re

          with open("Packaging/Info.plist", "rb") as handle:
              info = plistlib.load(handle)
          with open("package.json", encoding="utf-8") as handle:
              package = json.load(handle)
          version = os.environ["RELEASE_TAG"][1:]
          if version != info["CFBundleShortVersionString"] or version != package["version"]:
              raise SystemExit("Release tag, app version, and package.json version must match.")
          if not re.fullmatch(r"[0-9]+", info["CFBundleVersion"]):
              raise SystemExit("CFBundleVersion must be an unsigned integer.")
          if not os.path.isfile(f"docs/release-notes/v{version}.md"):
              raise SystemExit("Missing release notes for this version.")
          PY
          {
            echo "release_tag=$RELEASE_TAG"
            echo "release_version=${RELEASE_TAG#v}"
            echo "release_id=$RELEASE_ID"
            echo "source_sha=$SOURCE_SHA"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.label }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    environment: release-production
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            label: apple-silicon
            runner: macos-15
          - arch: x86_64
            label: intel
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Select latest Xcode and verify native runner
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$TARGET_ARCH"
          XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort -V | tail -n 1)"
          test -n "$XCODE_APP"
          echo "DEVELOPER_DIR=${XCODE_APP}/Contents/Developer" >> "$GITHUB_ENV"
      - name: Test release source
        run: |
          set -euo pipefail
          for script in scripts/*.sh; do bash -n "$script"; done
          npm ci
          npm test
          npm run check
          git diff --exit-code
          swift test
      - name: Configure Developer ID and notarization credentials
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          for name in APPLE_CERTIFICATE_P12_BASE64 APPLE_CERTIFICATE_PASSWORD \
            KEYCHAIN_PASSWORD APPLE_TEAM_ID APPLE_API_KEY_ID APPLE_API_ISSUER_ID \
            APPLE_API_PRIVATE_KEY_BASE64; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing release-production secret: $name" >&2
              exit 1
            fi
          done
          KEYCHAIN_PATH="$RUNNER_TEMP/release.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          API_KEY_PATH="$RUNNER_TEMP/notary-api-key.p8"
          echo "RELEASE_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          python3 - "$CERTIFICATE_PATH" "$API_KEY_PATH" <<'PY'
          import base64
          import os
          import sys

          for name, destination in [
              ("APPLE_CERTIFICATE_P12_BASE64", sys.argv[1]),
              ("APPLE_API_PRIVATE_KEY_BASE64", sys.argv[2]),
          ]:
              with open(destination, "wb") as handle:
                  handle.write(base64.b64decode(os.environ[name], validate=True))
          PY
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          CODE_SIGN_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' \
            | grep -F "($APPLE_TEAM_ID)" | head -n 1)"
          test -n "$CODE_SIGN_IDENTITY"
          xcrun notarytool store-credentials CODEX_ACCOUNT_SWITCHER_NOTARY \
            --key "$API_KEY_PATH" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID"
          echo "CODE_SIGN_IDENTITY=$CODE_SIGN_IDENTITY" >> "$GITHUB_ENV"
      - name: Build, sign, notarize, and verify installers
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          NOTARY_PROFILE: CODEX_ACCOUNT_SWITCHER_NOTARY
        run: scripts/build-release-dmg.sh
      - name: Upload architecture artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.label }}
          path: |
            dist/*.dmg
            dist/*.dSYM.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Remove temporary release credentials
        if: always()
        run: |
          if [[ -n "${RELEASE_KEYCHAIN_PATH:-}" && -f "$RELEASE_KEYCHAIN_PATH" ]]; then
            security delete-keychain "$RELEASE_KEYCHAIN_PATH" || true
          fi
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary-api-key.p8"

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: collected-artifacts
          merge-multiple: true
      - name: Upload installers, symbols, and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: |
          set -euo pipefail
          cd collected-artifacts
          ASSETS=()
          for label in apple-silicon intel; do
            for suffix in dmg dSYM.zip; do
              asset="CodexAccountSwitcher-${RELEASE_VERSION}-${label}.${suffix}"
              test -s "$asset"
              ASSETS+=("$asset")
            done
          done
          sha256sum "${ASSETS[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS
          gh release upload "$RELEASE_TAG" "${ASSETS[@]}" SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber
          IS_DRAFT="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.draft')"
          if [[ "$IS_DRAFT" == true ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"
          fi
